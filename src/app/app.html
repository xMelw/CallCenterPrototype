<div class="main flex flex-1 min-h-0 min-w-0">
    
    <div class="menu-container flex h-full" [class.collapsed]="isCollapsed">
        <app-menu (collapsedChange)="onCollapsedChange($event)" /> 
    </div>

    <div class="content-container flex min-w-0" >
        <app-header />

        <div class="content flex flex-1 min-h-0 min-w-0">
            <router-outlet />
            @if(!dataReady()){
                <div class="app-data-overlay flex flex-col items-center justify-center gap-3" role="status" aria-live="polite">
                    @if(dataError()){
                        <p>Não foi possível carregar os dados da aplicação.</p>
                        <button type="button" class="rounded-lg bg-sky-700 px-4 py-2 text-sm font-medium text-white" (click)="retryData()">Tentar novamente</button>
                    } @else {
                        <span class="loading-spinner" aria-hidden="true"></span>
                        <p>A carregar a aplicação…</p>
                    }
                </div>
            }
        </div>
    </div>
</div>
